name: Publish guide online
on:
  push:
    tags:
      - v[0-9].[0-9]+.[0-9]+-[0-9]+

  # Allow manual trigger
  workflow_dispatch:

# Deploying to GitHub Pages requires the repository setting
# Settings > Pages > Build and deployment > Source = "GitHub Actions"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Build openrndr-guide
        run: skipMediaGeneration=false xvfb-run ./gradlew dokgen --rerun-tasks --no-build-cache

      # Checks internal links and anchors, builds build/dokgen/zola
      # and uploads it as a GitHub Pages artifact
      - name: Build website
        uses: getzola/github-pages@v1
        with:
          zola_version: v0.23.6
          working_directory: build/dokgen/zola
          check_links: true
          check_flags: --skip-external-links

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
