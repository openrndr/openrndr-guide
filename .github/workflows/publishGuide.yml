name: Publish guide online
on:
  push:
    tags:
      - v[0-9].[0-9]+.[0-9]+-[0-9]+

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      regenerateMedia:
        description: Run all example programs, ignoring the media cache
        type: boolean
        default: false

# Deploying to GitHub Pages requires the repository setting
# Settings > Pages > Build and deployment > Source = "GitHub Actions"
permissions:
  # write: to update the media cache, a release asset
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      # The media cache is media/ from the previous run, stored as the
      # media.tar asset of the media-cache release. It includes the stamps
      # of the programs that produced the media, so only programs whose
      # source changed run again. See "Media cache" in contributing.md.
      - name: Restore media cache
        if: ${{ !inputs.regenerateMedia }}
        run: |
          if gh release download "$CACHE_RELEASE" --pattern media.tar --dir "$RUNNER_TEMP"; then
            tar xf "$RUNNER_TEMP/media.tar"
            if [ "$(cat media/.libs-hash 2>/dev/null)" != "$LIBS_HASH" ]; then
              echo "Library versions changed, running all example programs"
              rm -rf media
            fi
          else
            echo "No media cache found, running all example programs"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_RELEASE: media-cache
          LIBS_HASH: ${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Build openrndr-guide
        id: build
        run: skipMediaGeneration=false xvfb-run ./gradlew dokgen --no-build-cache

      # Also saved when a program failed, so the next run
      # doesn't repeat the programs that succeeded
      - name: Save media cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          # runExamples creates media/ even when no program ran successfully
          if [ -z "$(ls -A media/.dokgen-stamps 2>/dev/null)" ]; then
            echo "No program ran successfully, keeping the previous media cache"
            exit 0
          fi
          echo "$LIBS_HASH" > media/.libs-hash
          tar cf "$RUNNER_TEMP/media.tar" media
          gh release view "$CACHE_RELEASE" > /dev/null 2>&1 ||
            gh release create "$CACHE_RELEASE" --prerelease --title "Media cache" \
              --notes "Media generated by the publishGuide workflow, used to skip unchanged programs. Not a release of the guide."
          gh release upload "$CACHE_RELEASE" "$RUNNER_TEMP/media.tar" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CACHE_RELEASE: media-cache
          LIBS_HASH: ${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install pandoc and typst
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" --strip-components=2 "pandoc-${PANDOC_VERSION}/bin/pandoc"
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP/bin" --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
          PANDOC_VERSION: "3.13"
          TYPST_VERSION: "0.15.1"

      # Published with the website at https://guide.openrndr.org/openrndr-guide.pdf
      - name: Build PDF
        run: |
          python3 scripts/pdf/build_pdf.py
          cp build/dokgen/pdf/openrndr-guide.pdf build/dokgen/zola/static/

      # Checks internal links and anchors, builds build/dokgen/zola
      # and uploads it as a GitHub Pages artifact
      - name: Build website
        uses: getzola/github-pages@v1
        with:
          zola_version: v0.23.6
          working_directory: build/dokgen/zola
          check_links: true
          check_flags: --skip-external-links

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
