name: Links

# Checks the external links of the guide and opens an issue if some are broken.
# Internal links are checked by `zola check` when building the website.
on:
  repository_dispatch:
  workflow_dispatch:
  # After the guide is published
  workflow_run:
    workflows: ["Publish guide online"]
    types:
      - completed

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate the guide's Markdown
        run: skipMediaGeneration=true xvfb-run ./gradlew dokgen

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--scheme https --scheme http './build/dokgen/zola/content/**/*.md'"
          fail: false

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
