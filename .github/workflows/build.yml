# Builds the guide without producing screenshots or video files
name: Quick build
on:
  # Trigger the workflow on any pull request
  pull_request:

  push:
    branches:
      - main
  
  # Allow manual trigger
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build openrndr-guide
        run: skipMediaGeneration=true xvfb-run ./gradlew dokgen

      # Checks internal links and anchors, then builds the website.
      # The Pages artifact it uploads is not deployed from this workflow.
      - name: Check and build website
        uses: getzola/github-pages@v1
        with:
          zola_version: v0.23.6
          working_directory: build/dokgen/zola
          check_links: true
          check_flags: --skip-external-links

